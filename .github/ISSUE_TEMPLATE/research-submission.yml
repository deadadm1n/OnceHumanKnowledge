name: "🧪 Research submission"
description: "Submit a repeatable experiment, measurement, or system interaction"
title: "[Research] "
labels: []
body:
  - type: input
    id: topic
    attributes:
      label: System / mechanic
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Game version, scenario and phase
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Test setup and procedure
      description: Include gear, traits, buffs, inputs, timing and what variable changed.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results, units and sample size
      description: Report actual measurements, repetitions, anomalies, and uncertainty.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Screenshots, videos, patch references or relevant independent tests (no personal data).
    validations:
      required: false
  - type: dropdown
    id: confidence
    attributes:
      label: Claim status
      options:
        - "OBSERVED — directly tested"
        - "COMMUNITY — secondhand reports"
        - "HYPOTHESIS — not yet tested"
    validations:
      required: true
