name: Validate knowledge base

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate player blueprint example
        run: python tools/validate.py
      - name: Check JSON catalog and local Markdown links
        run: python tools/check_repository.py
